name: DAG needs block pipeline to run dependent jobs
on:
  workflow_dispatch:

  jobs:
    job-1:
      runs-on: ubuntu-22.04
      steps:
       -run: echo "this job1 this will be success first"

    job-2:
       runs-on: ubuntu-22.04
       needs:
         -job-1
       steps:
           run: echo "this job will only triger once job1 success"

    job-2:
       runs-on: ubuntu-22.04
       needs:
         -job-1
         -job-2
       steps:
           run: echo "this job will only triger once job1 and job2 is successfull"       